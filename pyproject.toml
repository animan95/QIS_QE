[project]
name = "qis_qe"
version = "0.1.0"
description = "Wannier-downfolded Hamiltonians from Quantum ESPRESSO for quantum algorithms"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "qiskit>=1.1,<1.3",
    "qiskit-nature>=0.7,<0.9",
    "qiskit-algorithms>=0.3,<0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# PySCF is not required to use the Wannier front end or the tensor core
# itself -- it's needed for tensors.from_pyscf_casci (building an
# ActiveSpaceHamiltonian from a PySCF CASCI/CASSCF object), and as an
# independent classical reference (FCI, trans_rdm1, spin_square) that
# tests/test_tensors.py and tests/test_solvers.py cross-check against.
validate = ["pyscf>=2.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
