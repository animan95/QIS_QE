[project]
name = "qis_qe"
version = "0.1.0"
description = "Wannier-downfolded Hamiltonians from Quantum ESPRESSO for quantum algorithms"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "qiskit>=1.1,<1.3",
    "qiskit-nature>=0.7,<0.9",
    "qiskit-algorithms>=0.3,<0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
